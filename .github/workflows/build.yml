name: Build Recalbox OS Web

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder tries to publish/download code-signing bits otherwise
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
            artifact: RecalboxOSWeb-Windows
          - os: ubuntu-latest
            name: Linux
            target: --linux
            artifact: RecalboxOSWeb-Linux
          - os: macos-latest
            name: macOS
            target: --mac
            artifact: RecalboxOSWeb-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The cores are bundled INTO the installer (offline app). Cached between runs
      # by runtime version so the CDN is only hit when EmulatorJS is upgraded.
      - name: Cache emulator cores
        id: cores-cache
        uses: actions/cache@v4
        with:
          path: www/data/cores
          key: ejs-cores-${{ hashFiles('www/data/emulator.min.js', 'scripts/download-cores.js') }}

      - name: Bundle emulator cores (all systems)
        run: npm run cores

      - name: Cache mamedev.org arcade games
        uses: actions/cache@v4
        with:
          path: |
            www/roms/alienar.zip
            www/roms/circus.zip
            www/roms/carpolo.zip
            www/roms/sidetrac.zip
            www/roms/ripcord.zip
            www/roms/fireone.zip
            www/roms/starfire.zip
            www/roms/targ.zip
            www/roms/spectar.zip
            www/roms/gridlee.zip
            www/roms/robby.zip
            www/roms/supertnk.zip
          key: mamedev-roms-${{ hashFiles('scripts/download-roms.js') }}

      - name: Fetch mamedev.org arcade games (not committed — see scripts/download-roms.js)
        run: npm run roms

      - name: Verify the bundle is complete (offline guarantee)
        run: |
          npm run cores:check
          npm run roms:check

      - name: Build ${{ matrix.name }} installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la dist | grep -Ev "\.(yml|yaml|blockmap)$|unpacked|^total" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Recalbox OS Web ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
