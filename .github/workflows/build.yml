name: Build Recalbox OS Web

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RecalboxOSWeb-Windows
          - os: ubuntu-latest
            artifact: RecalboxOSWeb-Linux
          - os: macos-latest
            artifact: RecalboxOSWeb-Mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The cores are bundled INTO the installer (offline app). Cached between runs
      # by runtime version so the CDN is only hit when EmulatorJS is upgraded.
      - name: Cache emulator cores
        id: cores-cache
        uses: actions/cache@v4
        with:
          path: www/data/cores
          key: ejs-cores-${{ hashFiles('www/data/emulator.min.js', 'scripts/download-cores.js') }}

      - name: Bundle emulator cores (all systems)
        run: npm run cores

      - name: Fetch mamedev.org arcade games (not committed — see scripts/download-roms.js)
        run: npm run roms

      - name: Verify the bundle is complete (offline guarantee)
        run: npm run cores:check

      - name: Build
        run: npx electron-builder --${{ runner.os == 'Windows' && 'win' || (runner.os == 'Linux' && 'linux' || 'mac') }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: ignore

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          update: true
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
